name: Sign and Release APK

on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: 'Median.co se APK ka direct download link'
        required: true

jobs:
  sign:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android Build Tools
        uses: android-actions/setup-android@v3

      - name: Download APK from Median
        run: |
          curl -L "${{ github.event.inputs.apk_url }}" -o app-unsigned.apk
          ls -lh app-unsigned.apk

      - name: Generate Production Release Keystore on Cloud
        run: |
          keytool -genkey -v -keystore ignis-release.jks \
            -alias ignisarena \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass ignis12345 -keypass ignis12345 \
            -dname "CN=Ignis Arena Esports, OU=Esports Division, O=Ignis Arena, L=Ellenabad, ST=Haryana, C=IN"

      - name: Zipalign APK (4-byte alignment)
        run: |
          zipalign -v -p 4 app-unsigned.apk app-aligned.apk

      - name: Sign APK with v2 & v3 Scheme
        run: |
          apksigner sign --ks ignis-release.jks \
            --ks-pass pass:ignis12345 \
            --ks-key-alias ignisarena \
            --key-pass pass:ignis12345 \
            --out app-release.apk \
            app-aligned.apk
          apksigner verify --verbose app-release.apk

      - name: Create Official GitHub Release (v1.2)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2
          name: "Ignis Arena v1.2 - Officially Signed Verified Release"
          body: |
            ## 🔥 Ignis Arena Official Esports Release (v1.2)
            * 100% Verified Android Production Signature (v2/v3).
            * Zero security scan failure / Anti-Cheat secured.
            * Edge-to-edge AMOLED Black status bar & splash screen.
          files: app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
